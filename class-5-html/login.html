<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login page</title>
  </head>
  <body>
    <h2>Login page</h2>
    <fieldset>
      <legend>User login</legend>
      <form>
        <table cellpadding="10">
          <tr>
            <td>Name</td>
            <td>:</td>
            <td>
              <input type="text" name="name" />
            </td>
          </tr>
          <tr>
            <td>Password</td>
            <td>:</td>
            <td>
              <input type="text" name="password" />
            </td>
          </tr>
          <tr>
            <td colspan="3">
              <p>Not have an account? <a href="reg.html">Register</a></p>
            </td>
          </tr>
          <tr>
            <td colspan="3" align="right">
              <button type="submit">
                <a href="profile.html"> login </a>
              </button>
            </td>
          </tr>
        </table>
      </form>
    </fieldset>
  </body>
</html>
