<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const duplicates = [1, 1, 1, 1, 1, 1, 1, 2];
      let new_list = [];

      for (let i = 0; i < duplicates.length; i++) {
        if (new_list.length == 1) {
          new_list.push(duplicates[i]);
          continue;
        }
        for (let j = 0; j < new_list.length; j++) {
          if (duplicates[i] === new_list[j]) {
            break;
          } else {
            new_list.push(duplicates[i]);
          }
        }
      }
      for (let i = 0; i < new_list.length; i++) {
        console.log(new_list[i]);
      }
    </script>
  </body>
</html>
